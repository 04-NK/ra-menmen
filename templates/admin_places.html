{% extends "base.html" %}

{% block title %}場所を追加 | ヨリタビ{% endblock %}
{% block body_class %}page-admin{% endblock %}

{% block content %}
  <main class="admin-content">
    <div class="admin-title-row">
      <div>
        <h1>場所を追加</h1>
        <p class="admin-lead">地図に載せるお店や観光地を登録します。</p>
      </div>
    </div>

    <section class="admin-panel">
      <!-- 登録結果を表示する -->
      {% if success %}
        <p class="form-message form-message-success">場所を登録しました。</p>
      {% endif %}

      {% if error %}
        <p class="form-message form-message-error">{{ error }}</p>
      {% endif %}

      <form class="place-form" method="post">
        <div class="form-grid">
          <label class="form-wide">
            <span>場所の名前 *</span>
            <input type="text" name="name" value="{{ form.get('name', '') }}" required>
          </label>

          <label>
            <span>カテゴリ *</span>
            <select name="category" required>
              <option value="">選択してください</option>
              {% for value, label in categories %}
                <option value="{{ value }}" {% if form.get('category') == value %}selected{% endif %}>{{ label }}</option>
              {% endfor %}
            </select>
          </label>

          <label>
            <span>価格帯</span>
            <select name="price_level">
              <option value="">未設定</option>
              <option value="1" {% if form.get('price_level') == '1' %}selected{% endif %}>安め</option>
              <option value="2" {% if form.get('price_level') == '2' %}selected{% endif %}>ふつう</option>
              <option value="3" {% if form.get('price_level') == '3' %}selected{% endif %}>高め</option>
            </select>
          </label>

          <label>
            <span>緯度 *</span>
            <input type="number" name="latitude" value="{{ form.get('latitude', '') }}" min="-90" max="90" step="any" required>
          </label>

          <label>
            <span>経度 *</span>
            <input type="number" name="longitude" value="{{ form.get('longitude', '') }}" min="-180" max="180" step="any" required>
          </label>

          <label class="form-wide">
            <span>説明</span>
            <textarea name="description" rows="4">{{ form.get('description', '') }}</textarea>
          </label>

          <label class="form-wide">
            <span>住所</span>
            <input type="text" name="address" value="{{ form.get('address', '') }}">
          </label>

          <label class="form-wide">
            <span>公式サイト</span>
            <input type="url" name="website_url" value="{{ form.get('website_url', '') }}" placeholder="https://">
          </label>

          <label class="form-wide">
            <span>情報の確認元</span>
            <input type="url" name="source_url" value="{{ form.get('source_url', '') }}" placeholder="https://">
          </label>

          <label>
            <span>確認日</span>
            <input type="date" name="last_verified_at" value="{{ form.get('last_verified_at', '') }}">
          </label>

          <label class="checkbox-label">
            <input type="checkbox" name="is_published" {% if not is_post or form.get('is_published') == 'on' %}checked{% endif %}>
            <span>登録後すぐ地図に表示する</span>
          </label>
        </div>

        <button class="form-submit" type="submit">登録する</button>
      </form>
    </section>
  </main>
{% endblock %}
