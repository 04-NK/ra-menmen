<!-- base.htmlを継承 -->
{% extends "base.html" %}


{% block title %}寄り道を探す | ヨリタビ{% endblock %}
{% block body_class %}page-app{% endblock %}

{% block head %}
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >
{% endblock %}

{% block content %}
  <main class="app-content">
    <!-- 営業中の場所だけに絞り込む -->
    <div class="map-toolbar" aria-label="地図の表示設定">
      <label class="map-filter-check">
        <input id="open-now-filter" type="checkbox">
        <span>今営業中</span>
      </label>

      <label class="map-sort">
        <span>並び順</span>
        <select id="place-sort">
          <option value="price_asc">安い順</option>
        </select>
      </label>
      <p id="place-count" class="place-count" aria-live="polite">場所を読み込み中</p>
    </div>

    <div class="map-layout">
      <div class="map-area">
        <!-- 地図を表示 -->
        <div id="map" aria-label="周辺の地図"></div>
        <p id="map-message" class="map-message" role="status" hidden></p>
        <!-- 地図と一覧の境目から一覧を開閉する -->
        <button
          id="place-list-toggle"
          class="place-list-toggle"
          type="button"
          aria-controls="place-list-panel"
          aria-expanded="true"
          aria-label="一覧を隠す"
          title="一覧を隠す"
        ><span class="place-list-toggle-icon" aria-hidden="true">›</span></button>
      </div>

      <!-- 地図上の場所を選択中の順番で表示 -->
      <aside id="place-list-panel" class="place-list-panel" aria-label="場所の一覧">
        <ol id="place-list" class="map-place-list"></ol>
      </aside>
    </div>
  </main>
{% endblock %}

{% block scripts %}
  <!-- Leaflet本体を先に読み込む -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <!-- map.jsを読み込む -->
  <script src="{{ url_for('static', filename='js/map.js') }}"></script>
{% endblock %}
