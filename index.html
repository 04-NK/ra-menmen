<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅fit - 遠征・イベント特化型スキマ観光プランナー</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: white;
      max-width: 600px;
      width: 100%;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
    }
    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 70px;
      height: 70px;
      background: #2563eb;
      color: white;
      font-size: 32px;
      font-weight: bold;
      border-radius: 16px;
      margin: 0 auto 20px;
    }
    h1 { font-size: 32px; color: #1f2937; margin-bottom: 12px; }
    .tagline { font-size: 16px; font-weight: bold; color: #2563eb; margin-bottom: 24px; }
    .description {
      text-align: left;
      background: #f8fafc;
      padding: 20px;
      border-radius: 12px;
      border-left: 4px solid #2563eb;
      font-size: 15px;
      line-height: 1.8;
      color: #4b5563;
      margin-bottom: 28px;
    }
    .status {
      display: inline-block;
      font-size: 13px;
      background: #dbeafe;
      color: #1e40af;
      padding: 6px 14px;
      border-radius: 9999px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">✈️</div>
    <h1>旅fit（タビフィット）</h1>
    <p class="tagline">ライブやフェスの合間・スキマ時間を最高の旅に</p>
    
    <div class="description">
      <strong>【解決する課題】</strong><br>
      「遠征でライブやフェスに来たけれど、前後の空き時間にどこへ行けばいいかわからない…」という人のために、イベント会場やホテルの位置・滞在時間に合わせて、無理なく回れる周辺スポットや最適ルートを提案するアプリです。
    </div>

    <div>
      <span class="status">🚀 PBI #0: Hello World 稼働中</span>
    </div>
  </div>
</body>
</html>
